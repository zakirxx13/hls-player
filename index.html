<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Somoy TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #263238,
      #080808 60%
    );

  color: white;

  font-family:
    Arial,
    sans-serif;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;
}

.container {

  width: min(
    900px,
    100%
  );

  background:
    rgba(
      255,
      255,
      255,
      0.08
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.15
    );

  border-radius: 22px;

  overflow: hidden;

  backdrop-filter:
    blur(20px);

  box-shadow:
    0 20px 60px
    rgba(
      0,
      0,
      0,
      0.5
    );
}

video {

  width: 100%;

  display: block;

  aspect-ratio: 16 / 9;

  background: #000;
}

.info {

  padding: 18px;
}

.title {

  font-size: 20px;

  font-weight: bold;
}

.status {

  margin-top: 8px;

  opacity: .7;

  font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

  <video
    id="video"
    controls
    playsinline>
  </video>

  <div class="info">

    <div class="title">
      Somoy TV
    </div>

    <div
      class="status"
      id="status">
      Connecting...
    </div>

  </div>

</div>


<script>

const video =
  document.getElementById(
    "video"
  );

const status =
  document.getElementById(
    "status"
  );


/*
 * IMPORTANT:
 *
 * Replace this with your
 * Cloudflare Worker URL.
 */

const WORKER =
  "https://vscrsp.zakirxx13.workers.dev";


const stream =
  WORKER +
  "/cdn/live/somoy_tv/playlist.m3u8";


function setStatus(text) {
  status.textContent = text;
}


/*
 * HLS.js
 */
if (Hls.isSupported()) {

  const hls =
    new Hls({
      enableWorker: true
    });

  hls.loadSource(
    stream
  );

  hls.attachMedia(
    video
  );

  hls.on(
    Hls.Events.MANIFEST_PARSED,
    () => {

      setStatus(
        "Stream connected"
      );

      video.play()
        .catch(() => {});

    }
  );

  hls.on(
    Hls.Events.ERROR,
    (event, data) => {

      console.log(
        "HLS error:",
        data
      );

      setStatus(
        "Stream error: " +
        data.type
      );

    }
  );

}


/*
 * Native HLS
 * Safari / compatible browsers
 */
else if (
  video.canPlayType(
    "application/vnd.apple.mpegurl"
  )
) {

  video.src = stream;

  video.addEventListener(
    "loadedmetadata",
    () => {

      setStatus(
        "Stream connected"
      );

      video.play()
        .catch(() => {});

    }
  );

}


/*
 * No HLS
 */
else {

  setStatus(
    "HLS is not supported"
  );

}

</script>

</body>

  </html>
